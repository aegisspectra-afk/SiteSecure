<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f5f9" />
    <title>SITE SECURE — מהסיור באתר ועד תעודת המסירה</title>
    <meta
      name="description"
      content="מערכת בעברית לחברות התקנה של מצלמות ומערכות אבטחה. הצעות מחיר, שטח, תיק אתר ותעודת מסירה — במקום אקסל ווואטסאפ."
    />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/landing-v2/02-quote-review-desktop.webp"
      fetchpriority="high"
    />
    <style>
      html {
        background-color: #f1f5f9;
        color-scheme: light;
      }
      html.dark {
        background-color: #0b1220;
        color-scheme: dark;
      }
      html.ss-brand-dark,
      html.ss-brand-dark body {
        background-color: #070b12;
        color-scheme: dark;
      }
      .ss-marketing-paint {
        margin: 0;
        padding: 1rem;
        background: #f1f5f9;
        color: #0f172a;
      }
      .ss-marketing-paint-title {
        margin: 0 0 0.75rem;
        font-family: Heebo, system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.2em;
        color: #64748b;
      }
      .ss-marketing-paint-shot {
        display: block;
        width: min(100%, 378px);
        height: auto;
        border-radius: 12px;
        box-shadow: 0 18px 44px rgb(15 23 42 / 12%);
      }
    </style>
    <script>
      (function () {
        var KEY = "site-secure-theme";
        var BRAND_CANVAS = "#070b12";
        function isBrandDarkPath(pathname) {
          var path = String(pathname || "/").split("?")[0].split("#")[0];
          if (!path) path = "/";
          if (path.length > 1 && path.charAt(path.length - 1) === "/") path = path.slice(0, -1);
          if (path === "/") return false;
          if (path === "/app" || path.indexOf("/app/") === 0) return false;
          if (path === "/admin" || path.indexOf("/admin/") === 0) return false;
          if (path === "/dev" || path.indexOf("/dev/") === 0) return false;
          return true;
        }
        var mode = "system";
        try {
          var stored = localStorage.getItem(KEY);
          if (stored === "light" || stored === "dark" || stored === "system") mode = stored;
        } catch (e) {}
        var dark = mode === "dark";
        if (mode === "system") {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {
            dark = false;
          }
        }
        var brandDark = isBrandDarkPath(location.pathname);
        var root = document.documentElement;
        root.dataset.themeMode = mode;
        root.dataset.theme = dark ? "dark" : "light";
        root.classList.toggle("dark", dark);
        root.classList.toggle("ss-brand-dark", brandDark);
        root.style.colorScheme = brandDark ? "dark" : dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", brandDark ? BRAND_CANVAS : dark ? "#0b1220" : "#f1f5f9");
      })();
    </script>
  </head>
  <body>
    <div id="ss-marketing-paint" hidden></div>
    <div id="root"></div>
    <script>
      (function () {
        var path = String(location.pathname || "/").split("?")[0].split("#")[0];
        if (path.length > 1 && path.charAt(path.length - 1) === "/") path = path.slice(0, -1);
        if (path !== "/") return;
        var paint = document.getElementById("ss-marketing-paint");
        if (!paint) return;
        paint.hidden = false;
        paint.setAttribute("dir", "rtl");
        paint.setAttribute("lang", "he");
        paint.className = "ss-marketing-paint";
        paint.innerHTML =
          '<p class="ss-marketing-paint-title">SITE SECURE</p>' +
          '<img src="/landing-v2/02-quote-review-desktop.webp" alt="" width="378" height="236" decoding="async" fetchpriority="high" class="ss-marketing-paint-shot" />';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
