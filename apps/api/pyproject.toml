[project]
name = "site-secure-api"
version = "0.1.0"
description = "SITE SECURE V2 FastAPI — business logic and user-JWT data path"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "fpdf2>=2.8",
  "uharfbuzz>=0.39",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
# Fonts live under app/assets/fonts and are already packaged via `packages = ["app"]`.
# Do not force-include the same path again — hatchling fails with duplicate archive entries.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: uses the connected V2 Supabase project with user JWTs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "RUF022", "SIM103", "FURB157", "FURB188", "DTZ003", "DTZ005"]
