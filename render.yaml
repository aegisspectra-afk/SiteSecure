# SITE SECURE V2 — Render Blueprint (FastAPI only, later)
# Web is on Vercel — docs/operations/VERCEL.md
# Do not host the Vite app here. Do not put SUPABASE_SERVICE_ROLE_KEY on Vercel.
#
# Apply this Blueprint only when FastAPI needs a public URL.
# Dashboard → New → Blueprint → this repo.
# Then paste secrets in the Render UI (sync: false keys). Never commit values.

previews:
  generation: manual

services:
  - type: web
    name: site-secure-api-staging
    runtime: python
    plan: free
    buildCommand: pip install -e ./apps/api
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_PUBLIC_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: CORS_EXTRA_ORIGINS
        value: ""
