# SITE SECURE V2 — Render Blueprint (FastAPI only)
# Web is on Vercel — docs/operations/VERCEL.md
# Do not host the Vite app here. Do not put SUPABASE_SERVICE_ROLE_KEY on Vercel.
#
# Dashboard → New → Blueprint → this repo (main).
# Paste only the sync:false secrets in the Render UI. Never commit values.
# No `previews:` — Hobby workspaces cannot enable Preview Environments.

services:
  - type: web
    name: site-secure-api-staging
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: WEB_PUBLIC_URL
        value: https://site-secure-umber.vercel.app
      - key: CORS_EXTRA_ORIGINS
        value: ""
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_PUBLIC_URL
        sync: false
